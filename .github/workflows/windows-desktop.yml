name: Windows desktop build

on:
  push:
    branches: [feature/three-analysis-modes]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install local OCR engine
        shell: pwsh
        run: |
          choco install tesseract --version=5.5.3.20260724 --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 3010)) { throw 'OCR installation failed' }
          $dataFolder = 'C:\Program Files\Tesseract-OCR\tessdata'
          foreach ($language in @('deu', 'eng')) {
            Invoke-WebRequest "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/$language.traineddata" -OutFile "$dataFolder\$language.traineddata"
          }
          Invoke-WebRequest 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/LICENSE' -OutFile "$dataFolder\tessdata-fast-LICENSE.txt"
      - name: Check actual OCR on synthetic scan
        env:
          SRA_OCR_TESTS: '1'
        run: python -m unittest discover -s tests -p test_processing.py -v
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check source GUI startup
        run: python desktop_app.py --smoke-test
      - name: Check small-window and display-scaling layouts
        env:
          SRA_GUI_TESTS: '1'
        run: python -m unittest discover -s tests -p test_desktop_layout.py -v
      - name: Capture desktop pages with synthetic data
        run: python tools/preview_gui.py
      - name: Ensure installer compiler
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build and test EXE and installer
        run: python tools/build_windows.py
      - name: Save downloadable build files
        uses: actions/upload-artifact@v4
        with:
          name: SmartResearchArchive-Windows-2.1.0
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Publish Windows release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/three-analysis-modes'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = 'desktop-v2.1.0-build.${{ github.run_number }}'
          gh release create $releaseTag artifacts/SmartResearchArchive-2.1.0-Setup.exe artifacts/SmartResearchArchive-2.1.0-Portable.zip artifacts/SHA256SUMS.txt artifacts/build-info.json --target '${{ github.sha }}' --title 'Smart Research Archive 2.1.0 — Windows' --prerelease --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
